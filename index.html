<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Urban Flood & Traffic Congestion Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #f8fafc;
    }
    .sub-text {
      font-size: 13px;
      color: #94a3b8;
      max-width: 420px;
      text-align: center;
      line-height: 1.5;
    }
    .cmd-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- Loading State: Tự động ẩn khi server Gradio online -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="status-text">🌊 AI Urban Flood & Traffic Congestion Monitor</div>
    <div class="sub-text">Đang kết nối tới máy chủ Kaggle GPU (Tesla T4)... Nếu server chưa bật, hãy mở terminal gõ lệnh:</div>
    <div class="cmd-badge">start-gpu</div>
  </div>

  <!-- 100% Giao diện nguyên bản SYNEXAN/AI-Urban-Flood-Traffic từ Gradio Backend -->
  <iframe 
    id="app-frame" 
    src="https://hush-harmless-erased.ngrok-free.dev" 
    allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"
    title="AI Urban Flood & Traffic Congestion Monitor">
  </iframe>

  <script>
    const overlay = document.getElementById("loading-overlay");
    const frame = document.getElementById("app-frame");

    function hideOverlay() {
      if (overlay.style.display !== "none") {
        overlay.style.opacity = "0";
        setTimeout(() => { overlay.style.display = "none"; }, 400);
      }
    }

    // Khi iframe tải xong
    frame.addEventListener("load", () => {
      // Cho một chút thời gian để Gradio dựng DOM
      setTimeout(hideOverlay, 800);
    });

    // Kiểm tra định kỳ xem Gradio server đã online chưa
    async function checkOnline() {
      try {
        const res = await fetch("https://hush-harmless-erased.ngrok-free.dev/", {
          headers: { "ngrok-skip-browser-warning": "true" }
        });
        if (res.ok) {
          hideOverlay();
        }
      } catch (e) {}
    }
    checkOnline();
    setInterval(checkOnline, 4000);
  </script>

</body>
</html>
